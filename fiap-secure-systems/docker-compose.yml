name: fiap-secure-systems

x-common-env: &common-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

services:
  postgres:
    image: postgres:16-alpine
    container_name: fss-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fss]

  localstack:
    image: localstack/localstack:3.5
    container_name: fss-localstack
    environment:
      <<: *common-env
      SERVICES: s3,sns,sqs
      DEBUG: "0"
      PERSISTENCE: "0"
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name analysis-jobs >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [fss]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: fss-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"   # Prometheus exporter scrape target
    healthcheck:
      # otel/opentelemetry-collector-contrib:0.103.0 is distroless — no wget/sh available.
      # Validate the static config as the readiness signal; the collector binary boots only if validate succeeds.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector-config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [fss]

volumes:
  postgres-data:

networks:
  fss:
    driver: bridge
    name: fss-network
