name: CI – orchestrator-service

on:
  pull_request:
    paths:
      - "fiap-secure-systems/orchestrator-service/**"
      - "fiap-secure-systems/build.gradle.kts"
      - "fiap-secure-systems/settings.gradle.kts"
      - "fiap-secure-systems/gradle/**"
      - "fiap-secure-systems/gradlew"
      - "fiap-secure-systems/infrastructure/contracts/**"
      - ".github/workflows/ci-orchestrator.yml"
  push:
    branches:
      - main
    paths:
      - "fiap-secure-systems/orchestrator-service/**"
      - "fiap-secure-systems/build.gradle.kts"
      - "fiap-secure-systems/settings.gradle.kts"
      - "fiap-secure-systems/gradle/**"
      - "fiap-secure-systems/gradlew"
      - "fiap-secure-systems/infrastructure/contracts/**"
      - ".github/workflows/ci-orchestrator.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fiap-orchestrator-service

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fiap-secure-systems

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fiap-secure-systems/**/*.gradle.kts', 'fiap-secure-systems/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :orchestrator-service:test --console=plain

      - name: Integration tests
        run: ./gradlew :orchestrator-service:integrationTest --console=plain

      - name: Build JAR
        run: ./gradlew :orchestrator-service:bootJar --console=plain

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: fiap-secure-systems
          file: fiap-secure-systems/orchestrator-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
