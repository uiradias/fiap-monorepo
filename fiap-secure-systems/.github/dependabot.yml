    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/fiap-secure-systems/orchestrator-service"
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: "/fiap-secure-systems/gateway-service"
    schedule: { interval: monthly }
