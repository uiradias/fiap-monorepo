server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — everything that is not a static file maps to index.html so
  # client-side routing handles deep links like /sessions/{id}.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache static assets (vite emits hashed filenames in /assets/).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
