server:
  port: 8081

spring:
  application:
    name: orchestrator-service
  datasource:
    url: ${ORCHESTRATOR_DATABASE_URL:jdbc:postgresql://localhost:5432/orchestrator_db}
    username: ${ORCHESTRATOR_DB_USER:orchestrator_user}
    password: ${ORCHESTRATOR_DB_PASSWORD:orchestrator_pwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  observations:
    key-values:
      service: orchestrator-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      transport: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}

orchestrator:
  internal-hmac-secret: ${INTERNAL_HMAC_SECRET:change-me-32-bytes-min-for-real-deployments}
  internal-hmac-replay-window-seconds: 300
  outbox:
    relay-interval-ms: ${ORCHESTRATOR_OUTBOX_RELAY_INTERVAL_MS:500}
    batch-size: ${ORCHESTRATOR_OUTBOX_RELAY_BATCH_SIZE:20}
    max-publish-attempts-before-alert: 10
  sqs:
    analysis-jobs-url: ${SQS_ANALYSIS_JOBS_URL:http://localhost:4566/000000000000/analysis-jobs}
    analysis-results-url: ${SQS_ANALYSIS_RESULTS_URL:http://localhost:4566/000000000000/analysis-results}
    analysis-results-dlq-url: ${SQS_ANALYSIS_RESULTS_DLQ_URL:http://localhost:4566/000000000000/analysis-results-dlq}
    poll-wait-seconds: ${ORCHESTRATOR_SQS_RESULTS_POLL_WAIT_SECONDS:10}
  sns:
    session-events-topic-arn: ${SNS_TOPIC_SESSION_EVENTS:arn:aws:sns:us-east-1:000000000000:session-events}
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  contracts-dir: ${ORCHESTRATOR_CONTRACTS_DIR:./contracts}
