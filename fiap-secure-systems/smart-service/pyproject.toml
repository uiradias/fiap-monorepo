[project]
name = "smart-service"
version = "0.1.0"
description = "AI-assisted architecture review service (FastAPI, Anthropic Claude)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
  "anthropic>=0.40,<1",
  "structlog>=24.1,<25",
  "jsonschema>=4.22,<5",
  "httpx>=0.27,<0.28",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-instrumentation-botocore>=0.48b0,<1",
  "opentelemetry-instrumentation-logging>=0.48b0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<6",
  "hypothesis>=6.108,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-jsonschema>=4.22,<5",
  "boto3-stubs[s3,sqs]>=1.34,<2",
  "testcontainers[postgres,localstack]>=4.7,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "N", "SIM", "RUF",
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: tests that require Testcontainers (Postgres or LocalStack)",
  "live: tests that hit the real Anthropic API (skipped by default)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:botocore.*",
]
