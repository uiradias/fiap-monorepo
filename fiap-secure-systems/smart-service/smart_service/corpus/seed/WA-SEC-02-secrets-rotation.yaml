doc_id: WA-SEC-02-secrets-rotation
source: aws-well-architected
title: "SEC-02: Secrets management and rotation"
category: security
version: "2026.05"
chunks:
  - applies_to:
      - "identity:vault"
      - "compute:container"
      - "compute:function"
    content: |
      Secrets must never live in source code, container images, or
      environment variables checked into configuration repositories. Each of
      those locations is replicated widely, indexed by search tools, and
      retained in build artefacts long after the secret is rotated, so a
      single leak becomes effectively permanent. The correct location is a
      dedicated secrets store such as HashiCorp Vault, AWS Secrets Manager,
      or Google Secret Manager, which provides encryption at rest, access
      auditing, fine-grained authorisation, and a rotation primitive.
      Workloads should fetch secrets at startup or lazily on first use, never
      bundle them into the image. Prefer dynamic secrets where the vault
      issues short-lived credentials per workload instance over static
      shared secrets that the same value across an entire fleet. Dynamic
      secrets convert a leaked credential from a permanent breach into a
      time-bounded one, and they preserve attribution because each instance
      receives a unique credential. For database access, use a vault that
      issues per-pod database users with TTLs measured in hours, not days,
      so a leaked credential auto-expires before it can be reused at scale.
      Audit access to the vault itself with at least the same rigor as the
      data it protects; a vault without access logs is no better than a
      shared file system.
  - applies_to:
      - "identity:vault"
      - "compute:container"
      - "compute:function"
    content: |
      Rotation cadence depends on the secret type. Static API keys to
      third-party services should rotate at least every 90 days, ideally
      automated through the vendor's API rather than a manual ticket.
      Database root credentials should rotate at least every 90 days and
      always immediately after any suspected compromise or operator
      departure. Service-to-service credentials should be dynamic with
      lifetimes under 24 hours, ideally under one hour for high-value
      services. Symmetric encryption keys for data at rest should rotate
      annually with old keys retained for decryption of previously
      encrypted data. The hardest part of rotation is not the rotation
      itself but proving that the new secret has been adopted by every
      consumer before the old one is revoked; build a graceful overlap
      window where both old and new credentials are valid, and instrument
      every consumer to report which version it is using. Look in a
      diagram for any service that authenticates without an explicit
      reference to a secrets store; if the credential origin is invisible,
      it is almost certainly a static value baked into the image or
      configuration. Common pitfalls include rotating the vault entry but
      forgetting to restart workloads that cached the old value, and
      rotating without coordinating across regions in active-active
      deployments.
