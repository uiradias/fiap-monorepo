name: fiap-secure-systems

x-common-env: &common-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fss-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fss]

  localstack:
    image: localstack/localstack:3.5
    container_name: fss-localstack
    environment:
      <<: *common-env
      SERVICES: s3,sns,sqs
      DEBUG: "0"
      PERSISTENCE: "0"
      LOCALSTACK_HOST: localstack
    ports:
      - "4566:4566"
    volumes:
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name analysis-jobs >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [fss]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: fss-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"   # Prometheus exporter scrape target
    healthcheck:
      # otel/opentelemetry-collector-contrib:0.103.0 is distroless — no wget/sh available.
      # Validate the static config as the readiness signal; the collector binary boots only if validate succeeds.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector-config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [fss]

  smart-service:
    image: fss/smart-service:dev
    build:
      context: ./smart-service
    container_name: fss-smart-service
    environment:
      <<: *common-env
      SMART_SERVICE_PROFILE: ${SMART_SERVICE_PROFILE:-e2e}
      SMART_DATABASE_URL: ${SMART_DATABASE_URL}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      SQS_ANALYSIS_JOBS_URL: ${SQS_ANALYSIS_JOBS_URL}
      SQS_ANALYSIS_RESULTS_URL: ${SQS_ANALYSIS_RESULTS_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_SERVICE_NAME: smart-service
    ports:
      - "8000:8000"
    volumes:
      - ./infrastructure/contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks: [fss]

  orchestrator-service:
    image: fss/orchestrator-service:dev
    build:
      context: .
      dockerfile: ./orchestrator-service/Dockerfile
    container_name: fss-orchestrator-service
    environment:
      <<: *common-env
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL}
      ORCHESTRATOR_DB_USER: ${ORCHESTRATOR_DB_USER}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      SQS_ANALYSIS_JOBS_URL: ${SQS_ANALYSIS_JOBS_URL}
      SQS_ANALYSIS_RESULTS_URL: ${SQS_ANALYSIS_RESULTS_URL}
      SQS_ANALYSIS_RESULTS_DLQ_URL: http://localstack:4566/000000000000/analysis-results-dlq
      SNS_TOPIC_SESSION_EVENTS: ${SNS_TOPIC_SESSION_EVENTS}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_SERVICE_NAME: orchestrator-service
      ORCHESTRATOR_CONTRACTS_DIR: /app/contracts
      ORCHESTRATOR_OUTBOX_RELAY_INTERVAL_MS: ${ORCHESTRATOR_OUTBOX_RELAY_INTERVAL_MS:-500}
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [fss]

  gateway-service:
    image: fss/gateway-service:dev
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: fss-gateway-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ""
      GATEWAY_PORT: 8080
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL}
      GATEWAY_DB_USER: ${GATEWAY_DB_USER}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET}
      SQS_SESSION_EVENTS_GATEWAY_URL: ${SQS_SESSION_EVENTS_GATEWAY_URL}
      GATEWAY_ORCHESTRATOR_BASE_URL: http://orchestrator-service:8081
      GATEWAY_INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      GATEWAY_RATE_LIMIT_AUTHED_PER_MINUTE: ${GATEWAY_RATE_LIMIT_AUTHED_PER_MINUTE:-60}
      GATEWAY_RATE_LIMIT_ANON_PER_MINUTE: ${GATEWAY_RATE_LIMIT_ANON_PER_MINUTE:-10}
      GATEWAY_WEBSOCKET_SNAPSHOT_EVENTS: ${GATEWAY_WEBSOCKET_SNAPSHOT_EVENTS:-50}
      GATEWAY_SQS_SESSION_EVENTS_POLL_WAIT_SECONDS: 10
      JWT_PRIVATE_KEY_PATH: /run/jwt/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/jwt/jwt-public.pem
      GATEWAY_CONTRACTS_DIR: /opt/contracts
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_SERVICE_NAME: gateway-service
    volumes:
      - ./infrastructure/jwt:/run/jwt:ro
      - ./infrastructure/contracts:/opt/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      orchestrator-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [fss]

  frontend:
    image: fss/frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL:-http://localhost:8080}
        VITE_GATEWAY_WS_URL: ${VITE_GATEWAY_WS_URL:-ws://localhost:8080}
    container_name: fss-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [fss]

volumes:
  postgres-data:

networks:
  fss:
    driver: bridge
    name: fss-network
