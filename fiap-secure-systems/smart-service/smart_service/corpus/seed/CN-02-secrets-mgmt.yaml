doc_id: CN-02-secrets-mgmt
source: cloud-native-security
title: "CN-02: Kubernetes secrets and sealed secrets"
category: security
version: "2026.05"
chunks:
  - applies_to:
      - "identity:vault"
      - "compute:container"
    content: |
      Kubernetes Secret objects are not encrypted by default; they are
      base64-encoded values stored in etcd, which is encryption at rest
      only if the cluster was explicitly configured with an encryption
      provider pointing at a KMS. Treat unencrypted Secret objects as
      cleartext from a threat-model perspective: any actor with read
      access to etcd backups, to the API server with broad RBAC, or to
      the kubelet running on the node where the Secret is mounted can
      read the plaintext. Enable etcd encryption at rest backed by a
      KMS, and verify it is configured for all Secret resources, not
      just a subset. Restrict RBAC so that workloads cannot list
      Secrets in their namespace, only mount the specific Secrets they
      need. Audit which service accounts have get or list permissions
      on Secrets; in clusters with developer access, broad permissions
      often grant indirect access to credentials the developer should
      not see. Prefer external secret management through tools like
      External Secrets Operator, which fetches values from a vault
      such as Vault, AWS Secrets Manager, or GCP Secret Manager and
      projects them into the cluster as ephemeral Secret resources
      synced on a schedule. This pattern keeps the authoritative
      secret outside the cluster, allows centralised rotation, and
      avoids storing long-lived plaintext in cluster state.
  - applies_to:
      - "compute:container"
    content: |
      Sealed Secrets provide a GitOps-friendly alternative for teams that
      want secret material in version control without committing
      plaintext. The Sealed Secrets controller in the cluster holds a
      private key; developers encrypt secrets with the matching public
      key and commit only the encrypted ciphertext, which the controller
      decrypts on the cluster and produces a regular Secret. This
      pattern is operationally pleasant because secrets travel with the
      application manifest, but it has a sharp edge: the cluster's
      private key is the master credential for every committed secret,
      so its compromise reveals all historical secrets in the repository
      across all commits. Rotate the sealing key on a schedule and after
      any suspected compromise, and re-encrypt all sealed secrets after
      rotation; without re-encryption the old key remains valid for
      historically committed ciphertexts. For high-value clusters,
      external secret management remains preferable because the secret
      never enters version control at all. Common pitfalls include
      mounting Secrets as environment variables, which exposes them to
      every subprocess and to crash dumps that often include the
      process environment; mount Secrets as files with restrictive
      permissions instead. Avoid using Secrets for configuration that
      is not actually secret, since the conflation makes both kinds of
      data harder to audit.
